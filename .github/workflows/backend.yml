name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:
    inputs:
      rotate_tokens:
        description: "Rotate SCHEDULED_PUBLISH_TOKEN and FRONTEND_REVALIDATE_TOKEN. Requires manually updating the Atlas Function secret and Amplify Console REVALIDATE_TOKEN afterward."
        required: false
        type: boolean
        default: false

env:
  LAMBDA_FUNCTION: neeraj-portfolio-backend-api

jobs:
  # ── 1. Build & vet (runs on every push and PR) ────────────────────────────
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

  # ── 2. Build and deploy Lambda backend (main branch only) ────────────────
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda artifact
        run: |
          set -euo pipefail
          cd backend
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bootstrap ./cmd/lambda
          zip -q lambda.zip bootstrap

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          # --query/--output text avoids printing the function's Environment.Variables
          # (which include secrets) into the CI log.
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file "fileb://backend/lambda.zip" \
            --publish \
            --no-cli-pager \
            --query 'FunctionArn' \
            --output text
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION"

      - name: Rotate scheduled-publish/revalidate tokens
        id: rotate
        if: github.event.inputs.rotate_tokens == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          new_publish_token="$(openssl rand -hex 32)"
          new_revalidate_token="$(openssl rand -hex 32)"
          echo "::add-mask::$new_publish_token"
          echo "::add-mask::$new_revalidate_token"
          gh secret set SCHEDULED_PUBLISH_TOKEN --body "$new_publish_token" -R "${{ github.repository }}"
          gh secret set FRONTEND_REVALIDATE_TOKEN --body "$new_revalidate_token" -R "${{ github.repository }}"
          echo "scheduled_publish_token=$new_publish_token" >> "$GITHUB_OUTPUT"
          echo "frontend_revalidate_token=$new_revalidate_token" >> "$GITHUB_OUTPUT"
          echo "::warning::Tokens rotated. You must now manually: (1) set REVALIDATE_TOKEN in Amplify Console (public app) to the new FRONTEND_REVALIDATE_TOKEN and redeploy the frontend (no automation available for Amplify env vars). The Atlas Function secret is updated automatically in the next step, if configured."

      - name: Update Atlas Function secret
        if: github.event.inputs.rotate_tokens == 'true'
        env:
          ATLAS_PUBLIC_KEY: ${{ secrets.ATLAS_PUBLIC_KEY }}
          ATLAS_PRIVATE_KEY: ${{ secrets.ATLAS_PRIVATE_KEY }}
          ATLAS_GROUP_ID: ${{ vars.ATLAS_GROUP_ID }}
          ATLAS_APP_ID: ${{ vars.ATLAS_APP_ID }}
          ATLAS_SECRET_NAME: ${{ vars.ATLAS_SECRET_NAME }}
          NEW_TOKEN: ${{ steps.rotate.outputs.scheduled_publish_token }}
        run: |
          set -euo pipefail
          if [ -z "$ATLAS_PUBLIC_KEY" ] || [ -z "$ATLAS_GROUP_ID" ] || [ -z "$ATLAS_APP_ID" ]; then
            echo "::warning::Atlas API credentials not configured (ATLAS_PUBLIC_KEY/ATLAS_PRIVATE_KEY/ATLAS_GROUP_ID/ATLAS_APP_ID). Skipping automatic Atlas Function secret update — paste the new SCHEDULED_PUBLISH_TOKEN into the Atlas Function's secret manually."
            exit 0
          fi
          secret_name="${ATLAS_SECRET_NAME:-SCHEDULED_PUBLISH_TOKEN}"
          base="https://services.cloud.mongodb.com/api/admin/v3.0"

          # curl -f dies silently under `set -e` before our own diagnostics run, so
          # capture status+body with -w instead and report the real HTTP response.
          login_response="$(curl -s -w '\n%{http_code}' -X POST "$base/auth/providers/mongodb-cloud/login" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg u "$ATLAS_PUBLIC_KEY" --arg k "$ATLAS_PRIVATE_KEY" '{username:$u, apiKey:$k}')")"
          login_status="${login_response##*$'\n'}"
          login_body="${login_response%$'\n'*}"
          if [ "$login_status" != "200" ]; then
            echo "::error::Atlas login failed (HTTP $login_status): $login_body — check ATLAS_PUBLIC_KEY/ATLAS_PRIVATE_KEY and the API key's IP access list."
            exit 1
          fi
          access_token="$(jq -r '.access_token' <<<"$login_body")"
          if [ -z "$access_token" ] || [ "$access_token" = "null" ]; then
            echo "::error::Atlas login response did not include an access_token: $login_body"
            exit 1
          fi

          secrets_response="$(curl -s -w '\n%{http_code}' "$base/groups/$ATLAS_GROUP_ID/apps/$ATLAS_APP_ID/secrets" \
            -H "Authorization: Bearer $access_token")"
          secrets_status="${secrets_response##*$'\n'}"
          secrets_body="${secrets_response%$'\n'*}"
          if [ "$secrets_status" != "200" ]; then
            echo "::error::Listing Atlas secrets failed (HTTP $secrets_status): $secrets_body — check ATLAS_GROUP_ID/ATLAS_APP_ID."
            exit 1
          fi
          secret_id="$(jq -r --arg name "$secret_name" '.[] | select(.name == $name) | ._id' <<<"$secrets_body")"
          if [ -z "$secret_id" ]; then
            echo "::error::No Atlas secret named '$secret_name' found in app $ATLAS_APP_ID. Set ATLAS_SECRET_NAME to the correct name."
            exit 1
          fi

          update_status="$(curl -s -o /dev/null -w '%{http_code}' -X PUT "$base/groups/$ATLAS_GROUP_ID/apps/$ATLAS_APP_ID/secrets/$secret_id" \
            -H "Authorization: Bearer $access_token" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg name "$secret_name" --arg value "$NEW_TOKEN" '{name:$name, value:$value}')")"
          if [ "$update_status" != "200" ] && [ "$update_status" != "204" ]; then
            echo "::error::Updating Atlas secret '$secret_name' failed (HTTP $update_status)."
            exit 1
          fi
          echo "Atlas Function secret '$secret_name' updated."

      - name: Configure content import and publishing
        env:
          CONTENT_IMPORT_TOKEN: ${{ secrets.CONTENT_IMPORT_TOKEN }}
          SCHEDULED_PUBLISH_TOKEN: ${{ steps.rotate.outputs.scheduled_publish_token || secrets.SCHEDULED_PUBLISH_TOKEN }}
          FRONTEND_REVALIDATE_TOKEN: ${{ steps.rotate.outputs.frontend_revalidate_token || secrets.FRONTEND_REVALIDATE_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
        run: |
          set -euo pipefail
          if [ -z "$CONTENT_IMPORT_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret CONTENT_IMPORT_TOKEN"
            exit 1
          fi
          if [ -z "$SCHEDULED_PUBLISH_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret SCHEDULED_PUBLISH_TOKEN"
            exit 1
          fi
          if [ -z "$FRONTEND_REVALIDATE_TOKEN" ]; then
            echo "::error::Missing GitHub Actions secret FRONTEND_REVALIDATE_TOKEN"
            exit 1
          fi

          aws ssm put-parameter \
            --name "/neeraj-portfolio/content-import-token" \
            --type SecureString \
            --value "$CONTENT_IMPORT_TOKEN" \
            --overwrite \
            --no-cli-pager \
            --query 'Version' \
            --output text >/dev/null

          aws ssm put-parameter \
            --name "/neeraj-portfolio/scheduled-publish-token" \
            --type SecureString \
            --value "$SCHEDULED_PUBLISH_TOKEN" \
            --overwrite \
            --no-cli-pager \
            --query 'Version' \
            --output text >/dev/null

          aws ssm put-parameter \
            --name "/neeraj-portfolio/frontend-revalidate-token" \
            --type SecureString \
            --value "$FRONTEND_REVALIDATE_TOKEN" \
            --overwrite \
            --no-cli-pager \
            --query 'Version' \
            --output text >/dev/null

          current=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --query 'Environment.Variables' \
            --output json)
          updated=$(jq -c \
            --arg import_token "$CONTENT_IMPORT_TOKEN" \
            --arg publish_token "$SCHEDULED_PUBLISH_TOKEN" \
            --arg revalidate_url "https://neerajsinghi.com/api/revalidate" \
            --arg revalidate_token "$FRONTEND_REVALIDATE_TOKEN" \
            --arg devto "$DEVTO_API_KEY" \
            --arg linkedin_token "$LINKEDIN_ACCESS_TOKEN" \
            --arg linkedin_author "$LINKEDIN_AUTHOR_URN" \
            --arg linkedin_version "$LINKEDIN_VERSION" \
            '. + {
              CONTENT_IMPORT_TOKEN: $import_token,
              SCHEDULED_PUBLISH_TOKEN: $publish_token,
              FRONTEND_REVALIDATE_URL: $revalidate_url,
              FRONTEND_REVALIDATE_TOKEN: $revalidate_token,
              DEVTO_API_KEY: $devto,
              LINKEDIN_ACCESS_TOKEN: $linkedin_token,
              LINKEDIN_AUTHOR_URN: $linkedin_author,
              LINKEDIN_VERSION: $linkedin_version
            }' <<<"$current")
          jq -n --argjson variables "$updated" '{Variables: $variables}' > "$RUNNER_TEMP/lambda-environment.json"
          aws lambda update-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --environment "file://$RUNNER_TEMP/lambda-environment.json" \
            --no-cli-pager \
            --query 'FunctionArn' \
            --output text >/dev/null
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION"
          rm -f "$RUNNER_TEMP/lambda-environment.json"
