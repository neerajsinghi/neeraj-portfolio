name: Backend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

env:
  LAMBDA_FUNCTION: neeraj-portfolio-backend-api

jobs:
  # ── 1. Build & vet (runs on every push and PR) ────────────────────────────
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

  # ── 2. Build and deploy Lambda backend (main branch only) ────────────────
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build Lambda artifact
        run: |
          set -euo pipefail
          cd backend
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o bootstrap ./cmd/lambda
          zip -q lambda.zip bootstrap

      - name: Update Lambda function code
        run: |
          set -euo pipefail
          # --query/--output text avoids printing the function's Environment.Variables
          # (which include secrets) into the CI log.
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --zip-file "fileb://backend/lambda.zip" \
            --publish \
            --no-cli-pager \
            --query 'FunctionArn' \
            --output text
          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION"
