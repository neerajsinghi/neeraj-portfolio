name: Frontend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

env:
  AMPLIFY_BRANCH: main

jobs:
  # ── 1. Type-check & build (runs on every push and PR) ─────────────────────
  check:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ── 2. Trigger Amplify deployment (main branch only) ──────────────────────
  deploy:
    name: Deploy to Amplify
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate deployment configuration
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::Missing GitHub Actions secret AMPLIFY_APP_ID. Set it from the Terraform amplify_app_id output."
            exit 1
          fi

      - name: Start Amplify deployment
        id: start
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name $AMPLIFY_BRANCH \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "Amplify job started: $JOB_ID"

      - name: Wait for deployment to complete
        run: |
          APP_ID=${{ secrets.AMPLIFY_APP_ID }}
          JOB_ID=${{ steps.start.outputs.job_id }}
          TIMEOUT=600   # 10 minutes
          ELAPSED=0
          INTERVAL=15

          while true; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)

            echo "[$ELAPSED s] Amplify status: $STATUS"

            case "$STATUS" in
              SUCCEED)
                echo "Deployment succeeded."
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Deployment $STATUS."
                exit 1
                ;;
            esac

            ELAPSED=$((ELAPSED + INTERVAL))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Timed out waiting for Amplify deployment."
              exit 1
            fi
            sleep $INTERVAL
          done

      # Tells Bing/Yandex/Seznam (and, via Bing, ChatGPT search and Copilot)
      # that every sitemap URL may have changed. Blog-only changes are already
      # submitted by /api/revalidate; this covers layout and page changes.
      # Best effort: an IndexNow outage never fails the deploy.
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true
        env:
          SITE_URL: https://neerajsinghi.com
          INDEXNOW_KEY: aa1f87905476d04fba78bdb170e832c8
        run: |
          URLS=$(curl -fsS "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g')
          if [ -z "$URLS" ]; then
            echo "::warning::No URLs found in $SITE_URL/sitemap.xml; skipping IndexNow."
            exit 0
          fi
          BODY=$(jq -n \
            --arg host "${SITE_URL#https://}" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$SITE_URL/$INDEXNOW_KEY.txt" \
            --arg urls "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}')
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') URLs to IndexNow: HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::warning::IndexNow returned HTTP $STATUS"
          fi

      # Bing's URL Submission API is separate from IndexNow and shows up on
      # the "URL Submission" page in Bing Webmaster Tools. Quota is tight
      # (100/day, 400/month), so this sends only the homepage, /blogs and
      # posts whose sitemap lastmod is within the last 2 days, capped at the
      # remaining daily quota. Skipped when BING_WEBMASTER_API_KEY is unset.
      - name: Submit changed URLs to Bing URL Submission API
        continue-on-error: true
        env:
          SITE_URL: https://neerajsinghi.com
          BING_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
        run: |
          if [ -z "$BING_API_KEY" ]; then
            echo "::warning::BING_WEBMASTER_API_KEY is not set; skipping Bing URL Submission."
            exit 0
          fi
          API=https://ssl.bing.com/webmaster/api.svc/json
          SITE_PARAM=$(jq -rn --arg s "$SITE_URL" '$s|@uri')
          CUTOFF=$(date -u -d '2 days ago' +%Y-%m-%dT%H:%M:%S)
          URLS=$(curl -fsS "$SITE_URL/sitemap.xml" | awk -v RS='</url>' -v site="$SITE_URL" -v cutoff="$CUTOFF" '
            match($0, /<loc>[^<]*<\/loc>/) {
              loc = substr($0, RSTART + 5, RLENGTH - 11)
              lastmod = match($0, /<lastmod>[^<]*<\/lastmod>/) ? substr($0, RSTART + 9, 19) : ""
              if (loc == site || loc == site "/blogs" || lastmod >= cutoff) print loc
            }')
          QUOTA=$(curl -fsS "$API/GetUrlSubmissionQuota?siteUrl=$SITE_PARAM&apikey=$BING_API_KEY" | jq -r '.d.DailyQuota // 0')
          if [ "$QUOTA" -le 0 ]; then
            echo "::warning::Bing daily URL submission quota is used up; skipping."
            exit 0
          fi
          URLS=$(echo "$URLS" | head -n "$QUOTA")
          BODY=$(jq -n --arg siteUrl "$SITE_URL" --arg urls "$URLS" \
            '{siteUrl: $siteUrl, urlList: ($urls | split("\n") | map(select(length > 0)))}')
          STATUS=$(curl -sS -o /tmp/bing.json -w '%{http_code}' -X POST "$API/SubmitUrlbatch?apikey=$BING_API_KEY" \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') URLs to Bing (quota left before submit: $QUOTA): HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::warning::Bing URL Submission returned HTTP $STATUS: $(cat /tmp/bing.json)"
          fi
