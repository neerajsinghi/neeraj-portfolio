name: Frontend — Build & Deploy

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch: {}

env:
  AMPLIFY_BRANCH: main

jobs:
  # ── 1. Type-check & build (runs on every push and PR) ─────────────────────
  check:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

  # ── 2. Trigger Amplify deployment (main branch only) ──────────────────────
  deploy:
    name: Deploy to Amplify
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      id-token: write   # required for OIDC
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Validate deployment configuration
        env:
          APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        run: |
          if [ -z "$APP_ID" ]; then
            echo "::error::Missing GitHub Actions secret AMPLIFY_APP_ID. Set it from the Terraform amplify_app_id output."
            exit 1
          fi

      - name: Start Amplify deployment
        id: start
        run: |
          JOB_ID=$(aws amplify start-job \
            --app-id ${{ secrets.AMPLIFY_APP_ID }} \
            --branch-name $AMPLIFY_BRANCH \
            --job-type RELEASE \
            --query 'jobSummary.jobId' \
            --output text)
          echo "job_id=$JOB_ID" >> $GITHUB_OUTPUT
          echo "Amplify job started: $JOB_ID"

      - name: Wait for deployment to complete
        run: |
          APP_ID=${{ secrets.AMPLIFY_APP_ID }}
          JOB_ID=${{ steps.start.outputs.job_id }}
          TIMEOUT=600   # 10 minutes
          ELAPSED=0
          INTERVAL=15

          while true; do
            STATUS=$(aws amplify get-job \
              --app-id "$APP_ID" \
              --branch-name "$AMPLIFY_BRANCH" \
              --job-id "$JOB_ID" \
              --query 'job.summary.status' \
              --output text)

            echo "[$ELAPSED s] Amplify status: $STATUS"

            case "$STATUS" in
              SUCCEED)
                echo "Deployment succeeded."
                exit 0
                ;;
              FAILED|CANCELLED)
                echo "Deployment $STATUS."
                exit 1
                ;;
            esac

            ELAPSED=$((ELAPSED + INTERVAL))
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Timed out waiting for Amplify deployment."
              exit 1
            fi
            sleep $INTERVAL
          done

      # Tells Bing/Yandex/Seznam (and, via Bing, ChatGPT search and Copilot)
      # that every sitemap URL may have changed. Blog-only changes are already
      # submitted by /api/revalidate; this covers layout and page changes.
      # Best effort: an IndexNow outage never fails the deploy.
      - name: Submit sitemap URLs to IndexNow
        continue-on-error: true
        env:
          SITE_URL: https://neerajsinghi.com
          INDEXNOW_KEY: aa1f87905476d04fba78bdb170e832c8
        run: |
          URLS=$(curl -fsS "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g')
          if [ -z "$URLS" ]; then
            echo "::warning::No URLs found in $SITE_URL/sitemap.xml; skipping IndexNow."
            exit 0
          fi
          BODY=$(jq -n \
            --arg host "${SITE_URL#https://}" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "$SITE_URL/$INDEXNOW_KEY.txt" \
            --arg urls "$URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: ($urls | split("\n") | map(select(length > 0)))}')
          STATUS=$(curl -sS -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "Submitted $(echo "$URLS" | wc -l | tr -d ' ') URLs to IndexNow: HTTP $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "202" ]; then
            echo "::warning::IndexNow returned HTTP $STATUS"
          fi
