services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8080
      - ALLOWED_ORIGIN=http://localhost:3000

  # Frontend is hosted on AWS Amplify in production.
  # This service is optional and only for local development.
  frontend-local:
    profiles:
      - local-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8080
    depends_on:
      - backend
